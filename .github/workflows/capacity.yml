name: Capacity benchmark

on:
  workflow_dispatch:
    inputs:
      warmup:
        description: Warm-up flows
        default: "20"
        required: true
      iterations:
        description: Measured flows
        default: "200"
        required: true
      concurrency:
        description: Concurrent flows
        default: "4"
        required: true
      duration_seconds:
        description: Timed run duration; 0 uses iterations
        default: "0"
        required: true
      backend:
        description: State backend to benchmark
        type: choice
        default: both
        options:
          - both
          - redis
          - valkey

permissions:
  contents: read

jobs:
  synthetic-http:
    name: Synthetic HTTP / Redis and Valkey
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      redis:
        image: redis:7.2.14
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:7.2.14
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate inputs
        env:
          WARMUP: ${{ inputs.warmup }}
          ITERATIONS: ${{ inputs.iterations }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          [[ "$WARMUP" =~ ^[0-9]+$ ]] && (( WARMUP <= 10000 ))
          [[ "$ITERATIONS" =~ ^[0-9]+$ ]] && (( ITERATIONS >= 1 && ITERATIONS <= 100000 ))
          [[ "$CONCURRENCY" =~ ^[0-9]+$ ]] && (( CONCURRENCY >= 1 && CONCURRENCY <= 128 ))
          [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] && (( DURATION_SECONDS <= 1800 ))

      - name: Benchmark Redis
        if: inputs.backend == 'both' || inputs.backend == 'redis'
        env:
          WARMUP: ${{ inputs.warmup }}
          ITERATIONS: ${{ inputs.iterations }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          bash ./mvnw --batch-mode --no-transfer-progress -pl chalsense-server -am \
            -Dchalsense.server.integration=true \
            -Dchalsense.capacity.benchmark=true \
            -Dchalsense.capacity.target=github-actions-redis-7.2.14 \
            -Dchalsense.capacity.warmup="$WARMUP" \
            -Dchalsense.capacity.iterations="$ITERATIONS" \
            -Dchalsense.capacity.concurrency="$CONCURRENCY" \
            -Dchalsense.capacity.duration-seconds="$DURATION_SECONDS" \
            -Dchalsense.audit.level=WARN \
            -Dchalsense.redis.port=6379 test
          cp chalsense-server/target/capacity-report.json capacity-redis.json

      - name: Benchmark Valkey
        if: inputs.backend == 'both' || inputs.backend == 'valkey'
        env:
          WARMUP: ${{ inputs.warmup }}
          ITERATIONS: ${{ inputs.iterations }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          bash ./mvnw --batch-mode --no-transfer-progress -pl chalsense-server -am \
            -Dchalsense.server.integration=true \
            -Dchalsense.capacity.benchmark=true \
            -Dchalsense.capacity.target=github-actions-valkey-7.2.14 \
            -Dchalsense.capacity.warmup="$WARMUP" \
            -Dchalsense.capacity.iterations="$ITERATIONS" \
            -Dchalsense.capacity.concurrency="$CONCURRENCY" \
            -Dchalsense.capacity.duration-seconds="$DURATION_SECONDS" \
            -Dchalsense.audit.level=WARN \
            -Dchalsense.redis.port=6380 test
          cp chalsense-server/target/capacity-report.json capacity-valkey.json

      - name: Publish job summary
        if: always()
        run: |
          for report in capacity-redis.json capacity-valkey.json; do
            if [[ -f "$report" ]]; then
              echo "### $report" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
