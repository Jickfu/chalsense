name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: OCI image / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build --tag chalsense-server:test .

      - name: Verify image metadata and hardened runtime
        run: |
          test "$(docker image inspect chalsense-server:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect chalsense-server:test --format '{{json .Config.Healthcheck.Test}}')" != "null"
          mkdir -p .container-test/backgrounds
          python3 - <<'PY'
          import struct, zlib
          width, height = 640, 360
          raw = b''.join(b'\x00' + bytes((30, 70, 120)) * width for _ in range(height))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('.container-test/backgrounds/background.png', 'wb').write(png)
          PY
          export CHALSENSE_BACKGROUND_DIRECTORY="$PWD/.container-test/backgrounds"
          export CHALSENSE_RATE_LIMIT_HMAC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          export CHALSENSE_SERVICE_SECRET_SHA256=Zmh6rfhivXdsj8GLjp-OIAiXFIVu4jOzkCpZHQ1fKSU
          docker compose --file deploy/compose/compose.yml config --quiet
          docker compose --file deploy/compose/compose.yml --file deploy/compose/compose.valkey.yml config --quiet
          docker network create chalsense-test
          docker run --detach --name state --network chalsense-test redis:7.2.14
          docker run --detach --name chalsense --network chalsense-test \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env SERVER_ADDRESS=0.0.0.0 \
            --env CHALSENSE_REDIS_URI=redis://state:6379 \
            --env CHALSENSE_RATE_LIMIT_HMAC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --env CHALSENSE_SERVICE_SECRET_SHA256=Zmh6rfhivXdsj8GLjp-OIAiXFIVu4jOzkCpZHQ1fKSU \
            --volume "$PWD/deploy/compose/application.yml:/opt/chalsense/config/application.yml:ro" \
            --volume "$PWD/.container-test/backgrounds:/data/backgrounds:ro" \
            chalsense-server:test
          for attempt in {1..30}; do
            if test "$(docker inspect chalsense --format '{{.State.Health.Status}}')" = "healthy"; then
              docker exec chalsense wget --quiet --output-document=- http://127.0.0.1:8080/readyz | grep '"status":"UP"'
              exit 0
            fi
            sleep 2
          done
          docker logs chalsense
          exit 1

      - name: Clean up containers
        if: always()
        run: |
          docker rm --force chalsense state 2>/dev/null || true
          docker network rm chalsense-test 2>/dev/null || true

  widget:
    name: Widget / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run unit tests
        run: npm run build:widget && npm run test:widget

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:widget:browser

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  redis-store:
    name: Redis Store / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    services:
      redis:
        image: redis:7.2.14
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:7.2.14
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test Redis OSS 7.2.14 Store and HTTP flow
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl chalsense-server -am
          -Dchalsense.redis.integration=true
          -Dchalsense.server.integration=true
          -Dchalsense.redis.host=127.0.0.1
          -Dchalsense.redis.port=6379
          test

      - name: Test Valkey 7.2.14 Store and HTTP flow
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl chalsense-server -am
          -Dchalsense.redis.integration=true
          -Dchalsense.server.integration=true
          -Dchalsense.redis.host=127.0.0.1
          -Dchalsense.redis.port=6380
          test
